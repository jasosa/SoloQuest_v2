<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C · Field Slate</title>
<meta name="viewport" content="width=1194, initial-scale=1">
<style>
@font-face { font-family: "HerosCn"; src: url(fonts/texgyreheroscn-regular.otf); font-weight: 400; }
@font-face { font-family: "HerosCn"; src: url(fonts/texgyreheroscn-bold.otf); font-weight: 700; }
@font-face { font-family: "Mono"; src: url(fonts/LiberationMono-Regular.ttf); font-weight: 400; }
@font-face { font-family: "Mono"; src: url(fonts/LiberationMono-Bold.ttf); font-weight: 700; }
:root {
  --slate: #1F2A2E;
  --slate-2: #24333A;
  --line: #34444A;
  --chalk: #E9EEF0;
  --chalk-2: #A9B6BB;
  --signal: #FF5A3C;
  --sel: #2F3F45;
  --off: #56656B;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1194px; height: 834px; overflow: hidden; }
body { background: var(--slate); color: var(--chalk); font: 16px/1.35 "HerosCn", "Arial Narrow", sans-serif; display: grid; grid-template-columns: 340px 1fr; grid-template-rows: 52px 1fr; }

.strip { grid-column: 1 / -1; display: flex; align-items: stretch; border-bottom: 1px solid var(--line); font-family: "Mono"; font-size: 14px; }
.strip > div { display: flex; align-items: center; gap: 8px; padding: 0 18px; border-right: 1px solid var(--line); color: var(--chalk-2); }
.strip b { color: var(--chalk); font-weight: 700; }
.strip .q { font-family: "HerosCn"; font-size: 20px; color: var(--chalk); gap: 12px; }
.strip .q span { font-family: "Mono"; font-size: 13px; color: var(--chalk-2); }
.strip .h b.hurt { color: var(--signal); }
.strip .sp { flex: 1; border-right: 0; }
.strip button { font: 700 14px "Mono"; color: var(--chalk); background: none; border: 0; border-left: 1px solid var(--line); padding: 0 18px; }

.side { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.sec { padding: 16px 20px; border-bottom: 1px solid var(--line); }
.lbl { font: 700 13px "HerosCn"; color: var(--chalk-2); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; }
.lbl span { font-family: "Mono"; letter-spacing: 0; text-transform: none; font-weight: 400; }

.sel-title { font-size: 26px; line-height: 1.1; font-weight: 700; }
.sel-sub { font-size: 15px; color: var(--chalk-2); margin: 4px 0 14px; }
.act { display: grid; gap: 8px; }
.act button { height: 48px; text-align: left; padding: 0 14px; font: 700 17px "HerosCn"; border-radius: 2px; border: 1px solid var(--chalk); background: var(--chalk); color: var(--slate); display: flex; justify-content: space-between; align-items: center; }
.act button span { font: 400 13px "Mono"; }
.act button.ghost { background: none; color: var(--chalk-2); border-color: var(--line); }

table { width: 100%; border-collapse: collapse; font-family: "Mono"; font-size: 14px; }
th { text-align: right; font: 400 12px "Mono"; color: var(--chalk-2); padding: 0 0 6px; }
th:first-child, td:first-child { text-align: left; }
td { padding: 9px 0; border-top: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
td .code { display: inline-block; min-width: 30px; padding: 2px 4px; background: var(--signal); color: var(--slate); font-weight: 700; text-align: center; margin-right: 8px; }

.foot { margin-top: auto; padding: 16px 20px 20px; }
.foot .w { font-family: "Mono"; font-size: 13px; color: var(--chalk-2); margin-bottom: 12px; }
.foot .w b { color: var(--chalk); }
.zt { width: 100%; height: 56px; border-radius: 2px; border: 1px solid var(--signal); background: none; color: var(--signal); font: 700 18px "HerosCn"; letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
.zt span { font: 400 13px "Mono"; letter-spacing: 0; text-transform: none; }

.mapwrap { position: relative; padding: 78px 0 0 26px; }
.coords { font: 400 11px "Mono"; fill: var(--off); }
</style>
</head>
<body>
<div class="strip">
  <div class="q">The Trial <span>Q01</span></div>
  <div>TURN <b>03</b></div>
  <div class="h">BAR <b>8</b> DWA <b>7</b> ELF <b class="hurt">5</b> WIZ <b>4</b></div>
  <div class="sp"></div>
  <button>UNDO</button>
</div>

<div class="side">
  <div class="sec">
    <div class="lbl">Selected <span>I16 · east wall</span></div>
    <div class="sel-title">Closed door</div>
    <div class="sel-sub">Alchemist's room, east wall. Behind it: not explored.</div>
    <div class="act">
      <button>Open door <span>free</span></button>
      <button class="ghost">Cancel</button>
    </div>
  </div>
  <div class="sec">
    <div class="lbl">In play <span>2</span></div>
    <table>
      <thead><tr><th>Monster</th><th>MV</th><th>AT</th><th>DF</th><th>BP</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="sec">
    <div class="lbl">Goal</div>
    <div style="font-size:16px">Find and destroy Verag, the gargoyle of the catacombs.</div>
  </div>
  <div class="foot">
    <div class="w">Wandering monster <b>Orc</b></div>
    <button class="zt">Zargon's turn <span>2 to act</span></button>
  </div>
</div>

<div class="mapwrap"><svg id="board"></svg></div>

<script src="data.js"></script>
<script>
(function () {
  const { W, H, area, state, isRevealed, walls, doorEdge } = window.HQ;
  const S = 31, PAD = 18;
  const svg = document.getElementById('board');
  svg.setAttribute('width', W * S + PAD + 4); svg.setAttribute('height', H * S + PAD + 4);
  const ns = 'http://www.w3.org/2000/svg';
  const el = (t, a, p = svg) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const css = getComputedStyle(document.documentElement); const v = n => css.getPropertyValue(n).trim();

  // coordinates: letters for columns, numbers for rows
  const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for (let x = 0; x < W; x++) { const t = el('text', { x: PAD + x * S + S / 2, y: 11, 'text-anchor': 'middle', class: 'coords' }); t.textContent = L[x]; }
  for (let y = 0; y < H; y++) { const t = el('text', { x: 12, y: PAD + y * S + S / 2 + 4, 'text-anchor': 'end', class: 'coords' }); t.textContent = y + 1; }
  const g = el('g', { transform: `translate(${PAD} ${PAD})` });

  // dotted grid for the unexplored board
  for (let y = 0; y <= H; y++) for (let x = 0; x <= W; x++) el('circle', { cx: x * S, cy: y * S, r: 1.1, fill: v('--line') }, g);
  el('rect', { x: 0, y: 0, width: W * S, height: H * S, fill: 'none', stroke: v('--line'), 'stroke-width': 1 }, g);

  // explored cells
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!isRevealed(x, y)) continue;
    el('rect', { x: x * S, y: y * S, width: S, height: S, fill: area(x, y) === 'C' ? v('--slate') : v('--slate-2'), stroke: v('--line'), 'stroke-width': .8 }, g);
    if (area(x, y) === 'C') el('rect', { x: x * S + 3, y: y * S + 3, width: S - 6, height: S - 6, fill: 'none', stroke: v('--line'), 'stroke-width': .6, 'stroke-dasharray': '2 3' }, g);
  }
  for (const w of walls()) el('line', { x1: w.x1 * S, y1: w.y1 * S, x2: w.x2 * S, y2: w.y2 * S, stroke: v('--chalk'), 'stroke-width': 2, 'stroke-linecap': 'square' }, g);

  // furniture as hatched boxes with a short label
  for (const f of state.furniture) {
    el('rect', { x: f.x * S + 3, y: f.y * S + 3, width: f.w * S - 6, height: f.h * S - 6, fill: 'none', stroke: v('--chalk-2'), 'stroke-width': 1 }, g);
    for (let i = 6; i < f.w * S + f.h * S; i += 7) {
      const x1 = f.x * S + 3 + Math.min(i, f.w * S - 6), y1 = f.y * S + 3 + Math.max(0, i - (f.w * S - 6));
      const x2 = f.x * S + 3 + Math.max(0, i - (f.h * S - 6)), y2 = f.y * S + 3 + Math.min(i, f.h * S - 6);
      el('line', { x1, y1, x2, y2, stroke: v('--line'), 'stroke-width': 1 }, g);
    }
  }
  // doors: a gap with a bar
  for (const d of state.doors) {
    const e = doorEdge(d); const cx = (e.x1 + e.x2) / 2 * S, cy = (e.y1 + e.y2) / 2 * S;
    const len = 16;
    el('line', { x1: cx - (e.vertical ? 0 : len / 2), y1: cy - (e.vertical ? len / 2 : 0), x2: cx + (e.vertical ? 0 : len / 2), y2: cy + (e.vertical ? len / 2 : 0), stroke: v('--slate'), 'stroke-width': 4 }, g);
    if (d.selected) el('rect', { x: cx - 15, y: cy - 15, width: 30, height: 30, fill: 'none', stroke: v('--chalk'), 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }, g);
    if (!d.open) el('rect', { x: cx - (e.vertical ? 3 : len / 2), y: cy - (e.vertical ? len / 2 : 3), width: e.vertical ? 6 : len, height: e.vertical ? len : 6, fill: v('--chalk') }, g);
    else el('line', { x1: cx - (e.vertical ? 0 : len / 2), y1: cy - (e.vertical ? len / 2 : 0), x2: cx + (e.vertical ? 4 : -len / 2 + 4), y2: cy + (e.vertical ? -len / 2 + 4 : 4), stroke: v('--chalk-2'), 'stroke-width': 1.5 }, g);
  }
  // monsters
  for (const m of state.monsters) {
    el('rect', { x: m.x * S + 4, y: m.y * S + 6, width: S - 8, height: S - 12, fill: v('--signal') }, g);
    const t = el('text', { x: m.x * S + S / 2, y: m.y * S + S / 2 + 4.5, 'text-anchor': 'middle', fill: v('--slate'), 'font-family': 'Mono', 'font-weight': 700, 'font-size': 12.5 }, g); t.textContent = m.code;
  }

  const rows = document.getElementById('rows');
  for (const m of state.monsters) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><span class="code">${m.code}</span>${m.type}</td><td>${m.move}</td><td>${m.att}</td><td>${m.def}</td><td>${m.body}/${m.maxBody}</td>`;
    rows.appendChild(tr);
  }
})();
</script>
</body>
</html>
