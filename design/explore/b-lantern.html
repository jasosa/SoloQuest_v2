<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · Lantern</title>
<meta name="viewport" content="width=1194, initial-scale=1">
<style>
@font-face { font-family: "Instrument"; src: url(fonts/InstrumentSerif-Regular.ttf); }
@font-face { font-family: "InterL"; src: url(fonts/Inter-Regular.otf); font-weight: 400; }
@font-face { font-family: "InterL"; src: url(fonts/Inter-Medium.otf); font-weight: 500; }
@font-face { font-family: "InterL"; src: url(fonts/Inter-SemiBold.otf); font-weight: 600; }
:root {
  --night: #0B0908;
  --stone: #2A2421;
  --floor: #3B332D;
  --corridor: #2E2824;
  --wall: #0B0908;
  --lantern: #E8A23A;
  --lantern-soft: rgba(232, 162, 58, .16);
  --blood: #C8452F;
  --text: #EDE3D6;
  --muted: #A3968A;
  --sel: #3A2F22;
  --off: #5A514B;
  --r: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1194px; height: 834px; overflow: hidden; background: var(--night); }
body { color: var(--text); font: 15px/1.4 "InterL", system-ui, sans-serif; position: relative; }
svg { position: absolute; left: 0; top: 0; }

.hud { position: absolute; }
.title { left: 40px; top: 26px; }
.title .q { font-size: 13px; color: var(--muted); letter-spacing: .02em; }
.title h1 { font: 400 44px/1 "Instrument", serif; letter-spacing: .005em; margin-top: 2px; }
.title p { margin-top: 8px; font-size: 14px; color: var(--muted); max-width: 300px; }

.heroes { left: 40px; top: 168px; display: flex; flex-direction: column; gap: 6px; }
.hero { display: grid; grid-template-columns: 82px 64px; align-items: center; font-size: 14px; color: var(--muted); }
.hero b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 3px; }
.pips i { width: 6px; height: 6px; border-radius: 50%; background: var(--lantern); }
.pips i.lost { background: var(--off); }

.top-right { right: 40px; top: 28px; display: flex; gap: 10px; align-items: center; }
.turn { font-size: 14px; color: var(--muted); margin-right: 8px; }
.turn b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.btn { height: 44px; padding: 0 18px; border-radius: var(--r); border: 0; font: 500 15px "InterL"; color: var(--text); background: var(--stone); }
.btn.primary { background: var(--blood); color: #fff; font-weight: 600; }

.monsters { right: 40px; top: 104px; width: 244px; display: flex; flex-direction: column; gap: 8px; }
.monsters h2 { font: 500 13px "InterL"; color: var(--muted); margin-bottom: 2px; }
.mon { background: var(--stone); border-radius: var(--r); padding: 10px 12px; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; }
.mon .tok { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--blood); display: grid; place-items: center; font: 600 12px "InterL"; color: var(--text); }
.mon .n { font-weight: 500; }
.mon .s { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mon button { width: 36px; height: 36px; border-radius: 8px; border: 0; background: var(--sel); color: var(--muted); font-size: 18px; }
.wander { font-size: 13px; color: var(--muted); margin-top: 4px; }

.pop { position: absolute; width: 228px; background: #1C1815; border-radius: 12px; padding: 14px; box-shadow: 0 0 0 1px rgba(232,162,58,.35), 0 18px 40px rgba(0,0,0,.6); }
.pop .k { font-size: 12.5px; color: var(--lantern); }
.pop h3 { font: 400 26px/1.1 "Instrument", serif; margin: 2px 0 6px; }
.pop p { font-size: 13.5px; color: var(--muted); margin-bottom: 12px; }
.pop .open { width: 100%; height: 48px; border-radius: var(--r); border: 0; background: var(--lantern); color: #1A1209; font: 600 16px "InterL"; }
</style>
</head>
<body>
<svg id="board"></svg>

<div class="hud title">
  <div class="q">Quest 1</div>
  <h1>The Trial</h1>
  <p>Find and destroy Verag, the gargoyle of the catacombs.</p>
</div>

<div class="hud heroes" id="heroes"></div>

<div class="hud top-right">
  <span class="turn">Turn <b>3</b></span>
  <button class="btn">Undo</button>
  <button class="btn primary">Zargon's turn</button>
</div>

<div class="hud monsters" id="monsters">
  <h2>In the light</h2>
</div>

<div class="pop" id="pop">
  <div class="k">Closed door</div>
  <h3>East of the alchemist's room</h3>
  <p>Open it to see the room behind. Free, not an action.</p>
  <button class="open">Open door</button>
</div>

<script src="data.js"></script>
<script>
(function () {
  const { W, H, area, state, isRevealed, walls, doorEdge } = window.HQ;
  const S = 43, OX = 38, OY = 8;
  const svg = document.getElementById('board');
  svg.setAttribute('width', 1194); svg.setAttribute('height', 834);
  const ns = 'http://www.w3.org/2000/svg';
  const el = (t, a, p = svg) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const css = getComputedStyle(document.documentElement); const v = n => css.getPropertyValue(n).trim();
  const g = el('g', { transform: `translate(${OX} ${OY})` });

  const defs = el('defs', {});
  const rg = el('radialGradient', { id: 'glow', cx: .5, cy: .5, r: .5 }, defs);
  el('stop', { offset: 0, 'stop-color': '#E8A23A', 'stop-opacity': .34 }, rg);
  el('stop', { offset: .6, 'stop-color': '#E8A23A', 'stop-opacity': .10 }, rg);
  el('stop', { offset: 1, 'stop-color': '#E8A23A', 'stop-opacity': 0 }, rg);
  const f = el('filter', { id: 'soft' }, defs); el('feGaussianBlur', { stdDeviation: 1.2 }, f);

  // faint board memory in the dark: every wall of the board at very low contrast
  const memo = (x1, y1, x2, y2) => el('line', { x1: x1 * S, y1: y1 * S, x2: x2 * S, y2: y2 * S, stroke: '#191512', 'stroke-width': 1.5 }, g);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const a = area(x, y), r = area(x + 1, y), b = area(x, y + 1);
    if (r && r !== a && !(a === 'C' && r === 'C') && !(isRevealed(x, y) && isRevealed(x + 1, y))) memo(x + 1, y, x + 1, y + 1);
    if (b && b !== a && !(a === 'C' && b === 'C') && !(isRevealed(x, y) && isRevealed(x, y + 1))) memo(x, y + 1, x + 1, y + 1);
  }
  el('rect', { x: 0, y: 0, width: W * S, height: H * S, fill: 'none', stroke: '#191512', 'stroke-width': 1.5 }, g);

  // explored floor
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!isRevealed(x, y)) continue;
    const c = area(x, y) === 'C' ? v('--corridor') : v('--floor');
    el('rect', { x: x * S + .5, y: y * S + .5, width: S - 1, height: S - 1, fill: c, rx: 2 }, g);
  }
  // lantern glow over the room just revealed
  const lit = []; for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (area(x, y) === state.litRoom) lit.push([x, y]);
  const xs = lit.map(p => p[0]), ys = lit.map(p => p[1]);
  const lx = (Math.min(...xs) + Math.max(...xs) + 1) / 2 * S, ly = (Math.min(...ys) + Math.max(...ys) + 1) / 2 * S;
  el('ellipse', { cx: lx, cy: ly, rx: 4.2 * S, ry: 4.2 * S, fill: 'url(#glow)' }, g);

  // walls
  for (const w of walls()) el('line', { x1: w.x1 * S, y1: w.y1 * S, x2: w.x2 * S, y2: w.y2 * S, stroke: v('--wall'), 'stroke-width': 5, 'stroke-linecap': 'square' }, g);

  // furniture: quiet silhouettes
  for (const fu of state.furniture) {
    if (fu.type === 'stairs') {
      for (let i = 0; i < 5; i++) el('rect', { x: fu.x * S + 6, y: fu.y * S + 6 + i * 16, width: fu.w * S - 12, height: 10, rx: 2, fill: '#4D433B' }, g);
    } else {
      el('rect', { x: fu.x * S + 6, y: fu.y * S + 6, width: fu.w * S - 12, height: fu.h * S - 12, rx: 4, fill: '#4A3F37' }, g);
    }
  }
  // doors
  for (const d of state.doors) {
    const e = doorEdge(d); const cx = (e.x1 + e.x2) / 2 * S, cy = (e.y1 + e.y2) / 2 * S;
    const w = e.vertical ? 8 : 26, h = e.vertical ? 26 : 8;
    if (d.selected) el('circle', { cx, cy, r: 26, fill: 'rgba(232,162,58,.22)' }, g);
    el('rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: 3, fill: d.open ? 'none' : v('--lantern'), stroke: d.open ? '#7A6A5C' : 'none', 'stroke-width': 1.5, 'stroke-dasharray': d.open ? '3 3' : '' }, g);
  }
  // monsters
  for (const m of state.monsters) {
    const cx = (m.x + .5) * S, cy = (m.y + .5) * S;
    el('circle', { cx, cy, r: 16, fill: '#1C1815', stroke: v('--blood'), 'stroke-width': 3 }, g);
    const t = el('text', { x: cx, y: cy + 4.5, 'text-anchor': 'middle', fill: v('--text'), 'font-family': 'InterL', 'font-weight': 600, 'font-size': 12.5 }, g); t.textContent = m.code;
  }

  // popover next to selected door
  const d = state.doors.find(x => x.selected); const e = doorEdge(d);
  const pop = document.getElementById('pop');
  pop.style.left = (OX + e.x1 * S + 34) + 'px';
  pop.style.top = (OY + (e.y1 + .5) * S - 150) + 'px';

  const hs = document.getElementById('heroes');
  for (const h of state.heroes) {
    const div = document.createElement('div'); div.className = 'hero';
    div.innerHTML = `<span>${h.name}</span><span class="pips">${Array.from({ length: h.max }, (_, i) => `<i class="${i < h.body ? '' : 'lost'}"></i>`).join('')}</span>`;
    hs.appendChild(div);
  }
  const ms = document.getElementById('monsters');
  for (const m of state.monsters) {
    const div = document.createElement('div'); div.className = 'mon';
    div.innerHTML = `<span class="tok">${m.code}</span><div><div class="n">${m.type}</div><div class="s">Att ${m.att} · Def ${m.def} · BP ${m.body}</div></div><button aria-label="Slain">✕</button>`;
    ms.appendChild(div);
  }
  const wd = document.createElement('div'); wd.className = 'wander'; wd.textContent = 'Wandering monster: Orc'; ms.appendChild(wd);
})();
</script>
</body>
</html>
